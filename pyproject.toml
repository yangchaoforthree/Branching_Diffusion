[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "branching-diffusion-temporal"
version = "0.1.0"
description = "Temporal branching diffusion code for point-process generation."
requires-python = ">=3.10"
dependencies = [
  "torch",
  "numpy",
  "PyYAML",
  "scipy",
]
